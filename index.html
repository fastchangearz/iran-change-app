<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c13"><meta name="description" content="ایران چنج؛ بستر ثبت درخواست و جستجوی تبادل ارز"><link rel="manifest" href="./manifest.webmanifest"><title>ایران چنج | اپلیکیشن مشتریان</title>
<style>
:root{--bg:#080c13;--panel:#111924;--panel2:#172332;--line:#293543;--gold:#e4c07a;--gold2:#a98141;--txt:#f4f2ee;--muted:#a2aab6;--green:#70d6b2;--red:#f2a5aa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#19263a 0,transparent 45%),var(--bg);color:var(--txt);font:14px/1.9 Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold)}.app{max-width:980px;margin:auto;padding:18px 15px 105px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.logo{color:var(--gold);font-size:23px;font-weight:bold;letter-spacing:1px}.tiny{font-size:11px;color:var(--muted)}.hero{border:1px solid #594b36;border-radius:24px;padding:23px;background:linear-gradient(125deg,#263348,#111923 60%,#211b14);margin-bottom:16px}.hero h1{font-size:24px;margin:8px 0}.hero p{color:#c1c6cd;margin:0}.eyebrow{font-size:11px;color:var(--gold);letter-spacing:2px}.panel{background:linear-gradient(145deg,#141e2b,#101720);border:1px solid var(--line);border-radius:19px;padding:18px;margin:12px 0}.panel h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted)}.notice{border:1px solid #65522f;background:#292317;border-radius:13px;color:#eed5a5;padding:12px;margin:13px 0;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{background:#172332;border:1px solid #344052;border-radius:16px;padding:17px;text-align:right;color:var(--txt);white-space:normal}.tile strong{display:block;color:var(--gold);font-size:17px}.tile span{font-size:12px;color:var(--muted)}.btn{background:#1a2839;border:1px solid #3b4b5d;color:var(--txt);border-radius:13px;padding:12px 15px}.btn.gold{background:linear-gradient(110deg,#b68d4d,#f3d593);border:0;color:#201a11;font-weight:bold}.btn.full{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}.field{width:100%;background:#0b131e;color:var(--txt);border:1px solid #405065;border-radius:12px;padding:12px;margin:6px 0 13px;min-height:46px}.field::placeholder{color:#7f8998}.label{display:block;color:#d9c49c;font-size:12px}.bar{display:flex;gap:9px;align-items:center;justify-content:space-between}.bar.wrap{flex-wrap:wrap}.chip{display:inline-block;padding:3px 10px;border:1px solid #4b5260;border-radius:40px;font-size:11px;color:#c7d1df}.chip.goldish{border-color:#7c6134;color:var(--gold)}.card{padding:14px 0;border-bottom:1px solid var(--line)}.card:last-child{border-bottom:0}.card-title{font-weight:bold;font-size:15px}.price{font-size:17px;color:var(--gold);font-weight:bold}.bottom{position:fixed;bottom:0;right:0;left:0;background:#0b121deb;backdrop-filter:blur(12px);border-top:1px solid #303c4a;display:flex;justify-content:center;padding:8px 4px max(9px,env(safe-area-inset-bottom));z-index:5}.bottom button{width:min(19%,125px);background:transparent;border:0;color:#aab3c0;font-size:11px;line-height:1.7;padding:6px 1px}.bottom button.active{color:var(--gold)}.bottom i{font-size:22px;display:block;font-style:normal}.steps{display:flex;gap:4px;margin:12px 0}.steps span{height:4px;flex:1;border-radius:8px;background:#344254}.steps span.done{background:var(--gold)}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1}.empty{text-align:center;padding:26px 10px;color:var(--muted)}.error{color:var(--red);font-size:12px}.success{color:var(--green)}.small{font-size:12px}a{color:var(--gold)}@media(min-width:680px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.app{padding-top:26px}.hero{padding:32px}}
</style></head><body><div class="app"><header class="top"><div><div class="logo">✦ IRAN CHANGE</div><div class="tiny">ایران چنج | تبادل ارز، ساده و حرفه‌ای</div></div><span class="chip goldish">نسخه پیش‌نمایش</span></header><main id="view"></main></div><nav class="bottom" id="nav" aria-label="منوی اصلی"></nav>
<script>
'use strict';
const countries=[['🇮🇷 ایران','+98'],['🇩🇪 آلمان','+49'],['🇹🇷 ترکیه','+90'],['🇫🇷 فرانسه','+33'],['🇮🇹 ایتالیا','+39'],['🇳🇱 هلند','+31'],['🇬🇧 انگلستان','+44'],['🇺🇸 آمریکا / کانادا','+1'],['🇦🇪 امارات','+971'],['🇷🇺 روسیه','+7'],['🇪🇸 اسپانیا','+34'],['🇧🇪 بلژیک','+32'],['🇨🇭 سوئیس','+41'],['🇦🇺 استرالیا','+61'],['🌍 سایر کشورها','other']];
const currencies=['🇪🇺 یورو','🇺🇸 دلار آمریکا','🇬🇧 پوند انگلیس','🇨🇭 فرانک سوئیس','🇦🇪 درهم امارات','🇹🇷 لیر ترکیه','🇨🇦 دلار کانادا','🇦🇺 دلار استرالیا','🇷🇺 روبل روسیه','✍️ سایر ارزها'];
const methods=['🏦 حواله بانکی','💵 اسکناس','🔵 رولوت','🅿️ پی‌پال','🌐 وسترن یونیون','💠 وایز','🏦 SEPA','🏦 SWIFT','💸 Zelle','💸 Venmo','🌐 مانی‌گرام','✍️ سایر روش‌ها'];
const locations=['🇩🇪 آلمان','🇹🇷 ترکیه','🇫🇷 فرانسه','🇮🇹 ایتالیا','🇳🇱 هلند','🇧🇪 بلژیک','🇬🇧 انگلستان','🇷🇺 روسیه','🇦🇪 امارات','🇺🇸 آمریکا','🇨🇦 کانادا','🇮🇷 ایران','🇪🇸 اسپانیا','🇨🇭 سوئیس','✍️ سایر کشورها'];
let page='home',step=0,request={},preview=[],searchTerm='',searchType='همه',regCountry='+98';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,kind='')=>`<button class="btn ${kind}" onclick="${action}">${label}</button>`;
const note='این نسخه، پیش‌نمایش رابط کاربری است. هنوز به سرور، پیامک، اطلاعات واقعی ربات یا معاملات متصل نیست؛ هیچ درخواست یا پرداخت واقعی ثبت نمی‌شود.';
const panel=(title,content)=>`<section class="panel"><h2>${title}</h2>${content}</section>`;
function goto(p){page=p;render();window.scrollTo(0,0)}
function nav(){const n=[['home','⌂','خانه'],['search','⌕','جستجو'],['new','＋','درخواست'],['activity','▤','فعالیت‌ها'],['profile','♙','پروفایل']];$('nav').innerHTML=n.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="goto('${p}')"><i>${i}</i>${t}</button>`).join('')}
function render(){nav();let h='';if(page==='home')h=`<section class="hero"><div class="eyebrow">WELCOME TO IRAN CHANGE</div><h1>معامله ارز، با تجربه‌ای متفاوت</h1><p>درخواست خرید یا فروش ارز خود را ثبت کنید، آگهی‌ها را بررسی کنید و پیشنهاد قیمت بدهید.</p><div class="actions" style="margin-top:20px">${button('＋ ایجاد درخواست','goto(\'new\')','gold')}${button('⌕ جستجوی حواله‌ها','goto(\'search\')')}</div></section><div class="notice">${note}</div><div class="grid"><button class="tile" onclick="goto('new')"><strong>＋ درخواست جدید</strong><span>خرید یا فروش ارز</span></button><button class="tile" onclick="goto('search')"><strong>⌕ جستجو</strong><span>خریداران و فروشندگان</span></button><button class="tile" onclick="goto('activity')"><strong>▤ فعالیت‌های من</strong><span>درخواست‌ها و پیشنهادها</span></button><button class="tile" onclick="goto('profile')"><strong>♙ حساب کاربری</strong><span>ثبت‌نام و ورود امن</span></button></div>`+panel('آگهی‌های جدید',`<div class="empty">پس از اتصال به سرور، آگهی‌های واقعی و فعال ربات ایران چنج در این بخش نمایش داده می‌شوند.</div>`)+panel('ارتباط با ایران چنج',`<div class="actions">${button('کانال‌های رسمی','goto(\'channels\')')}${button('پشتیبانی','goto(\'support\')')}</div>`);
if(page==='profile')h=panel('ورود و ثبت‌نام',`<p class="muted">ثبت‌نام با شماره موبایل ایران یا خارج از کشور؛ ورود بیومتریک پس از راه‌اندازی احراز هویت امن.</p><label class="label" for="country">پیش‌شماره کشور</label><select id="country" class="field" onchange="regCountry=this.value;document.getElementById('customPrefix').hidden=this.value!=='other'">${countries.map(([n,v])=>`<option value="${v}" ${regCountry===v?'selected':''}>${n} (${v==='other'?'پیش‌شماره دلخواه':v})</option>`).join('')}</select><div id="customPrefix" ${regCountry==='other'?'':'hidden'}><label class="label">پیش‌شماره بین‌المللی</label><input class="field" id="prefix" placeholder="مثلاً +46" inputmode="tel"></div><label class="label" for="phone">شماره موبایل</label><input id="phone" class="field" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="شماره بدون پیش‌شماره"><div id="phoneError" class="error"></div><button class="btn gold full" onclick="checkPhone()">ادامه و دریافت کد تأیید</button><div class="notice">ارسال پیامک هنوز فعال نیست. برای حفظ امنیت، هیچ شماره‌ای در این نسخه ذخیره یا ارسال نمی‌شود.</div><div class="bar wrap"><span class="chip">🔐 رمز یک‌بارمصرف</span><span class="chip">◉ اثر انگشت</span><span class="chip">◈ تشخیص چهره</span></div>`);
if(page==='new')h=renderRequest();
if(page==='search')h=panel('جستجوی درخواست‌ها',`<label class="label">جستجو بر اساس شماره حواله، ارز یا روش انتقال</label><input id="searchInput" class="field" placeholder="مثلاً یورو، رولوت یا شماره حواله" value="${esc(searchTerm)}" oninput="searchTerm=this.value"><label class="label">نوع درخواست</label><select id="searchType" class="field" onchange="searchType=this.value">${['همه','خریدار یورو','فروشنده یورو','خریدار دلار','فروشنده دلار','سایر ارزها'].map(x=>`<option ${searchType===x?'selected':''}>${x}</option>`).join('')}</select><div class="empty">هنوز به فهرست آگهی‌های واقعی متصل نشده‌ایم. پس از اتصال، نتایج با قیمت و شماره حواله قابل مشاهده خواهند بود.</div>`);
if(page==='activity')h=panel('درخواست‌های من',`<div class="empty">برای مشاهده درخواست‌های فعال خود، ابتدا وارد حساب شوید و سرور به ربات متصل شود.</div>${button('ورود / ثبت‌نام','goto(\'profile\')','gold')}`)+panel('پیشنهادهای ارسالی من',`<div class="empty">پس از اتصال به حساب واقعی، پیشنهادهای شما اینجا نمایش داده می‌شوند.</div>`)+panel('گفت‌وگوها و توافق‌ها',`<div class="empty">مکالمات خصوصی و توافق‌های واقعی شما پس از اتصال امن نمایش داده می‌شوند.</div>`);
if(page==='channels')h=panel('کانال‌های رسمی',`<p class="muted">آگهی‌های ارز پس از انتشار از طریق ربات در کانال مربوطه قرار می‌گیرند.</p><div class="card"><b>کانال یورو</b><div><a href="https://t.me/IranChangeEuro" target="_blank" rel="noopener noreferrer">@IranChangeEuro</a></div></div><div class="card"><b>کانال دلار</b><div><a href="https://t.me/IranChangeDolar" target="_blank" rel="noopener noreferrer">@IranChangeDolar</a></div></div><div class="card"><b>سایر ارزها</b><div><a href="https://t.me/IranChangeGlobal" target="_blank" rel="noopener noreferrer">@IranChangeGlobal</a></div></div>`);
if(page==='support')h=panel('پشتیبانی',`<p class="muted">پشتیبانی داخل اپلیکیشن پس از اتصال سرور فعال می‌شود.</p><a href="https://t.me/IranChangeArzBot" target="_blank" rel="noopener noreferrer">ورود به ربات ایران چنج در تلگرام</a>`);
$('view').innerHTML=h}
function checkPhone(){const p=$('phone').value.replace(/[\s()\-]/g,'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));const prefix=regCountry==='other'?($('prefix')?.value||''):regCountry;if(!/^\+[1-9]\d{0,3}$/.test(prefix)||!/^\d{6,14}$/.test(p)){ $('phoneError').textContent='پیش‌شماره و شماره موبایل را به‌صورت صحیح وارد کنید.';return }$('phoneError').textContent='';alert('فرمت شماره معتبر است. ارسال کد تأیید پس از راه‌اندازی سرویس احراز هویت فعال خواهد شد.');}
const requestSteps=[['نام و نام خانوادگی','name'],['شماره تماس','phone'],['انتخاب ارز','currency'],['نوع درخواست','trade'],['روش انتقال','method'],['کشور','country'],['مقدار ارز','amount'],['قیمت هر واحد (تومان)','price'],['توضیحات','description']];
function options(list,key){return `<select class="field" id="reqValue"><option value="">انتخاب کنید...</option>${list.map(x=>`<option value="${esc(x)}" ${request[key]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function renderRequest(){if(step>=9)return panel('پیش‌نمایش درخواست',`<p class="muted">این اطلاعات فقط برای بررسی شما نمایش داده می‌شوند و به هیچ سروری ارسال نمی‌شوند.</p>${requestSteps.map(([n,k])=>`<div class="card"><span class="muted">${n}</span><div>${esc(request[k]||'—')}</div></div>`).join('')}<div class="notice">برای انتشار واقعی، اتصال به سرور و تأیید هویت لازم است. دکمه انتشار در نسخه نمایشی غیرفعال است.</div><div class="actions">${button('بازگشت و اصلاح','step=8;render()')}${button('انتشار پس از اتصال سرور','void(0)','gold')} </div>`).replace('onclick="void(0)"','disabled');
const [label,key]=requestSteps[step];let field='';if(key==='currency')field=options(currencies,key);else if(key==='trade')field=options(['🟢 خریدار ارز','🔴 فروشنده ارز'],key);else if(key==='method')field=options(methods,key);else if(key==='country')field=options(locations,key);else if(key==='description')field=`<textarea class="field" id="reqValue" rows="4" placeholder="اختیاری؛ اطلاعات شخصی یا بانکی وارد نکنید">${esc(request[key]||'')}</textarea>`;else field=`<input class="field" id="reqValue" value="${esc(request[key]||'')}" ${key==='phone'?'type="tel" inputmode="tel"':key==='amount'||key==='price'?'inputmode="decimal"':'type="text"'} placeholder="${key==='amount'?'مثلاً 500':key==='price'?'مثلاً 120000':esc(label)}">`;
return panel('ایجاد درخواست جدید',`<div class="bar"><span class="muted">مرحله ${step+1} از ۹</span><span class="chip goldish">${esc(label)}</span></div><div class="steps">${requestSteps.map((_,i)=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div><label class="label" for="reqValue">${esc(label)}</label>${field}<div id="reqError" class="error"></div><div class="actions">${button(step===0?'انصراف':'مرحله قبل',step===0?"goto('home')":"saveBack()")}${button(step===8?'مشاهده پیش‌نمایش':'مرحله بعد','saveNext()','gold')}</div><div class="notice">این فرم برای بررسی طراحی است. اطلاعات واردشده به سرور ارسال نمی‌شود و با بستن صفحه از بین می‌رود.</div>`)}
function saveBack(){const v=$('reqValue');if(v)request[requestSteps[step][1]]=v.value;step=Math.max(0,step-1);render()}
function saveNext(){const key=requestSteps[step][1],v=$('reqValue').value.trim();if(!v&&key!=='description'){$('reqError').textContent='لطفاً این بخش را تکمیل کنید.';return}if((key==='amount'||key==='price')&&(!/^\d+(?:[.,]\d+)?$/.test(v.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))||Number(v.replace(/,/g,''))<=0)){$('reqError').textContent='لطفاً مقدار عددی معتبر وارد کنید.';return}request[key]=v;step++;render();window.scrollTo(0,0)}
render();if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
